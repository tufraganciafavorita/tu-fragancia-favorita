name: Mejorar foto rosa

on:
  push:
    paths:
      - ".github/workflows/mejorar-foto-rosa.yml"

permissions:
  contents: write

jobs:
  mejorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mejorar imagen
        run: |
          convert sol-neceser-68-rosa-products-tiny.jpg -resize 450x563 -unsharp 0x1+1+0 -quality 90 sol-neceser-68-rosa-products-tiny.jpg
      - name: Guardar
        run: |
          git config user.name "tufraganciafavorita"
          git config user.email "andreaabulez@gmail.com"
          git add sol-neceser-68-rosa-products-tiny.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar calidad foto neceser rosa"
          git push
