name: Mejorar foto rosa v3

on:
  push:
    paths:
      - ".github/workflows/mejorar-foto-rosa-v3.yml"

permissions:
  contents: write

jobs:
  mejorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mejorar imagen
        run: |
          ffmpeg -y -i sol-neceser-68-rosa-products-tiny.jpg -vf "scale=450:563:flags=lanczos,unsharp=5:5:1.0:5:5:0.0" -q:v 3 /tmp/pink.jpg
          mv /tmp/pink.jpg sol-neceser-68-rosa-products-tiny.jpg
      - name: Guardar
        run: |
          git config user.name "tufraganciafavorita"
          git config user.email "andreaabulez@gmail.com"
          git add sol-neceser-68-rosa-products-tiny.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar calidad foto neceser rosa"
          git push
